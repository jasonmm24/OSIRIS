[project]
name = "osiris"
version = "1.0"
description = "Asistente virtual de escritorio para Linux con interfaz PySide6 y Ollama."
readme = "README.md"
authors = [
    { name = "jasonmm24", email = "jason240208@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.3",
    "pyside6>=6.12.0",
    "textual>=8.2.8",
]

[project.scripts]
osiris = "osiris:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
